name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel stale runs on the same ref so only the latest commit gates a merge.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Lint / Typecheck / Test / Audit / Build
    runs-on: ubuntu-latest
    env:
      # `next build` runs t3-env validation (src/env.js). CI has no real
      # secrets/DB, so skip it at build time — env is validated again at runtime
      # once real variables are present. This is the T3-recommended escape hatch.
      SKIP_ENV_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Next.js 16 requires Node 20.9+; match local dev (22).
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest run --coverage

      - name: Dependency audit (high+)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — committed secrets are public forever

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Real Postgres so the production build (started by Playwright via
      # `npm run preview`) can connect, migrate, and the critical-path test
      # can actually register + log a run.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: runtrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d runtrack_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Reach the service container on localhost. All values are throwaway
      # CI-only secrets; nothing real lives here.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/runtrack_test
      AUTH_SECRET: ci-e2e-throwaway-secret-not-for-production-0123456789abcdef
      # Required by src/env.js schema but unused by the Credentials-only flow.
      AUTH_DISCORD_ID: unused
      AUTH_DISCORD_SECRET: unused
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser (chromium + OS deps)
        # The chromium CDN download intermittently stalls silently (2 of 3
        # runs hung for 14+ min until the job timeout). A hard per-attempt
        # timeout + one retry, plus the cache above, keeps this reliable.
        run: |
          timeout 420 npx playwright install --with-deps chromium && exit 0
          echo "::warning::First install attempt failed or stalled — retrying once"
          timeout 420 npx playwright install --with-deps chromium

      - name: Run E2E
        # playwright.config.ts boots its own production build (`npm run preview`)
        # on :3001 (CI does not reuse an existing server); the build inherits
        # this job's env, and `trustHost: true` lets auth work on localhost.
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
